<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CROMA TAILORS - License Key Generator</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; border: 1px solid #e2e8f0; }
        h1 { font-size: 20px; font-weight: 800; margin-bottom: 20px; color: #1e293b; }
        input { width: 100%; height: 45px; border: 2px solid #e2e8f0; border-radius: 10px; margin-bottom: 20px; text-align: center; font-family: monospace; font-size: 14px; box-sizing: border-box; }
        button { width: 100%; height: 45px; background: #000; color: #fff; border: none; border-radius: 10px; font-weight: 800; cursor: pointer; transition: transform 0.1s; }
        button:active { transform: scale(0.98); }
        .result { margin-top: 30px; padding: 15px; background: #f1f5f9; border-radius: 10px; display: none; }
        .result-label { font-size: 10px; font-weight: 800; color: #64748b; text-transform: uppercase; margin-bottom: 5px; }
        .key { font-family: monospace; font-size: 18px; font-weight: 900; color: #10b981; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔑 Key Generator</h1>
        <p style="font-size: 12px; color: #64748b; margin-bottom: 20px;">Paste the client's Request Code below</p>
        <input type="text" id="machineId" placeholder="A43D9253-C11E-ED11-..." spellcheck="false">
        <button onclick="generateKey()">GENERATE ACTIVATION KEY</button>

        <div id="resultBox" class="result">
            <div class="result-label">Generated Key for Client</div>
            <div id="keyDisplay" class="key">XXXX-XXXX-XXXX-XXXX</div>
            <p style="font-size: 10px; color: #94a3b8; margin-top: 10px;">Copy and send this to the client</p>
        </div>
    </div>

    <script>
        const SECRET_SALT = "CROMA_SECURE_2024";

        async function generateKey() {
            const machineId = document.getElementById('machineId').value.trim();
            if (!machineId) return alert("Please enter a Request Code!");

            const msgUint8 = new TextEncoder().encode(machineId + SECRET_SALT);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            
            const key = hashHex.substring(0, 16).toUpperCase();
            
            document.getElementById('keyDisplay').innerText = key;
            document.getElementById('resultBox').style.display = 'block';
        }
    </script>
</body>
</html>
